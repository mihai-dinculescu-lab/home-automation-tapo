[package]
name = "home-automation-tapo"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
actix = "0.13"
actix-rt = "2.15"
actix-web = { version = "4.18", default-features = false }
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
derive_more = { version = "2.1", features = ["display"] }
futures-util = "0.3"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls",
] }
opentelemetry-semantic-conventions = { version = "0.33", features = [
    "semconv_experimental",
] }
paho-mqtt = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Pinned to main for `CameraHandler::get_detections`; swap back to the crate at 0.13.0 or 0.12.1.
tapo = { git = "https://github.com/mihai-dinculescu/tapo", rev = "02918745a0de5b323d7282098dcc8442d2189b41" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = { version = "0.1", features = ["attributes"] }
tracing-actix-web = "0.7"
tracing-log = "0.2"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "registry",
    "std",
] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
