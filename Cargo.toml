[package]
name = "home-automation-tapo"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
actix = "0.13"
actix-rt = "2.15"
actix-web = { version = "4.15", default-features = false }
anyhow = "1.0"
config = { version = "0.15", default-features = false, features = ["yaml"] }
derive_more = { version = "2.1", features = ["display"] }
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = { version = "0.33", features = [
    "semconv_experimental",
] }
paho-mqtt = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tapo = "0.11"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal"] }
tracing = { version = "0.1", features = ["attributes"] }
tracing-actix = "0.4"
tracing-actix-web = "0.7"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "registry",
    "std",
] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
