api:
  host:
  port:
# the credentials of every Tapo device: the API, the usage polling and the heating
tapo:
  username:
  password:
# optional, required when device_usage or heating is enabled
mqtt:
  # tcp://host:port
  address:
# optional, a missing section is the same as `enabled: false`
device_usage:
  # a disabled section starts no polling, and the rest of it is kept as written
  enabled:
  # how often to fetch the device usage of devices
  refresh_rate_s:
  # topic the usage is published on
  publish_topic:
  # at least one; set `enabled` to `false` to switch the polling off
  devices:
    - name:
      ip_address:
      # set to `false` for plugs that are always on and the time usage becomes irrelevant
      record_time_usage:
# optional, a missing section is the same as `enabled: false`
heating:
  # a disabled section starts no thermostat and leaves every heater alone, and the rest of it is
  # kept as written
  enabled:
  # topic filter the sensor readings the thermostats use are received on, e.g. `sensors/#`
  sensors_subscribe_topic:
  # topic every thermostat's decisions are published on, one message per tick
  decisions_publish_topic:
  # at least one; set `enabled` to `false` to switch the heating off
  thermostats:
    - name:
      # a disabled thermostat is not started and leaves its heaters alone
      enabled:
      # IANA name the periods are in, e.g. Europe/London
      time_zone:
      # the parts of the day in which the thermostat runs, each with its own rule; outside every
      # period nothing is queried and the heaters are switched off on every tick. At least one;
      # periods may abut but not overlap, and a gap between two of them has to last at least
      # interval_s or not exist at all
      active_periods:
        # HH:MM, inclusive
        - start:
          # HH:MM, exclusive; an end before the start crosses midnight
          end:
          # target in °C
          target_temperature:
          # whether the heaters are only switched on while a person is present; `false` heats the
          # room regardless, e.g. before anyone is up
          require_presence:
      # the device that decides presence: a camera's person detections, or a T100's motion
      presence:
        # the Tapo handler of the device: camera (C120) | camera_ptz (C210, C220, C225, C325WB,
        # C520WS, TC40, TC70) | t100
        device_type:
        # t100 only; delete this key for a camera. The Tapo handler of the hub the sensor is
        # paired with: hub (H100) | hub_ir (H110) | camera_hub (H200, H500)
        hub_type:
        # the device's name in the Tapo app: the camera's, or the sensor's for a t100, which has
        # to be the only t100 of that name on its hub. A device that carries another name is a
        # presence error, which switches the heaters off in a period that requires presence
        name:
        # the camera's address, or the hub's for a t100
        ip_address:
        # presence this many seconds ago still counts, at least interval_s and at most 86400
        # (24 hours); a t100 detects motion rather than people, so it needs a longer window
        # than a camera
        window_s:
      # matches the `location` field of the sensor payload
      sensor_location:
      # P110 plugs switched together
      heaters:
        - name:
          ip_address:
          # optional; delete this block for a heater that heats as soon as its plug powers it.
          # What is done to the heater itself once its plug has been switched on
          follow_up:
            # the kind of heater: dimplex_remo (a Dimplex of the Remo app, such as the EVO2BTA,
            # which starts in Standby and is put in Manual over Bluetooth LE)
            device_type:
            # a disabled follow-up leaves the heater as its plug powers it on, and the rest of
            # it is kept as written
            enabled:
            # the heater's Bluetooth address in quotes, e.g. "00:A0:50:41:9A:26"; no two
            # enabled follow-ups of enabled thermostats may share one
            bluetooth_address:
            # the setpoint in °C the heater is put in Manual at, a whole number; set it above
            # every period's target, so that the thermostat decides when the room is warm
            temperature:
      # half-width of the band around the target in which the last command is repeated
      deadband:
      # a reading older than this many seconds is treated as missing, at most 86400 (24 hours)
      reading_max_age_s:
      # the longest time between two evaluations, in seconds, the one used when no sensor reading arrives
      interval_s:
      # the shortest time between two evaluations, in seconds: every sensor reading is evaluated
      # as it arrives, or once this has passed since the last evaluation; at least 60 and less than
      # interval_s
      min_interval_s:
