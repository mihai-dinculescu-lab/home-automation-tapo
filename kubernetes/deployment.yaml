apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-automation-tapo
spec:
  replicas: 1
  template:
    metadata:
      name: home-automation-tapo
    spec:
      containers:
        - name: tapo
          image: ghcr.io/mihai-dinculescu-lab/home-automation-tapo
          imagePullPolicy: Always
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://grafana-k8s-monitoring-alloy-receiver.grafana-alloy.svc.cluster.local:4318"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=home-automation,deployment.environment.name=production"
          volumeMounts:
            - name: tapo-config
              mountPath: /app/settings.yaml
              subPath: settings.yaml
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health-check
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tapo-config
          secret:
            secretName: home-automation-tapo-secrets
            items:
              - key: settings.yaml
                path: settings.yaml
