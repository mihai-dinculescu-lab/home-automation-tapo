apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-automation-tapo
spec:
  replicas: 1
  template:
    metadata:
      name: home-automation-tapo
    spec:
      containers:
        - name: tapo
          image: ghcr.io/mihai-dinculescu-lab/home-automation-tapo
          imagePullPolicy: Always
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.monitoring:4318"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=home-automation,deployment.environment.name=production"
          volumeMounts:
            - name: tapo-config
              mountPath: /app/settings.yaml
              subPath: settings.yaml
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          # The health check does a round trip to the coordinator actor, so the probe sees a
          # coordinator that has stopped or a stuck actor thread, not only a dead web server.
          # It gives the coordinator a second to answer; the probe allows a little longer so
          # that it is the round trip that fails, not the kubelet giving up first.
          livenessProbe:
            httpGet:
              path: /health-check
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: tapo-config
          secret:
            secretName: home-automation-tapo-secrets
            items:
              - key: settings.yaml
                path: settings.yaml
