apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-automation-tapo
spec:
  replicas: 1
  # A rolling update would run the old pod and the new one together for a few seconds, and a Tapo
  # plug holds one session, so each pod's login would fail the other's commands. Recreate stops
  # the old pod before the new one starts; the new pod asserts the heaters on its first tick, so
  # the gap costs nothing.
  strategy:
    type: Recreate
  template:
    metadata:
      name: home-automation-tapo
    spec:
      containers:
        - name: tapo
          image: ghcr.io/mihai-dinculescu-lab/home-automation-tapo
          imagePullPolicy: Always
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.monitoring:4318"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=home-automation,deployment.environment.name=production"
          # The heater follow-up reaches the node's BlueZ over the system bus, whose socket is
          # mounted below. The default AppArmor profile of the container runtime keeps a pod off
          # that bus even with the socket in reach, so the container runs without one.
          securityContext:
            appArmorProfile:
              type: Unconfined
          volumeMounts:
            - name: tapo-config
              mountPath: /app/settings.yaml
              subPath: settings.yaml
              readOnly: true
            - name: dbus
              mountPath: /run/dbus
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          # The health check does a round trip to the coordinator actor, so the probe sees a
          # coordinator that has stopped or a stuck actor thread, not only a dead web server.
          # It gives the coordinator a second to answer; the probe allows a little longer so
          # that it is the round trip that fails, not the kubelet giving up first.
          livenessProbe:
            httpGet:
              path: /health-check
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: tapo-config
          secret:
            secretName: home-automation-tapo-secrets
            items:
              - key: settings.yaml
                path: settings.yaml
        # Every node the pod can land on needs BlueZ installed and `bluetoothd` running for the
        # follow-up to work; on one without it only the follow-up fails. That holds for a node
        # without the directory too, which is created empty rather than keeping the pod from
        # starting.
        - name: dbus
          hostPath:
            path: /run/dbus
            type: DirectoryOrCreate
